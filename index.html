<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Detector</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap;
    gap: 10px 16px; align-items: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(0,0,0,.65); font-size: 14px; }
  button { font-size: 16px; padding: 10px 18px; border: 0; border-radius: 8px;
    background: #2f81f7; color: #fff; }
  button:disabled { opacity: .5; }
  label { display: flex; align-items: center; gap: 6px; }
  input[type=range] { width: 110px; }
  #status { margin-left: auto; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="wrap"><canvas id="view" width="640" height="360"></canvas></div>
<div id="ui">
  <button id="start">Start</button>
  <label><input type="checkbox" id="driving" checked> Driving only</label>
  <label>Conf <input type="range" id="conf" min="0.1" max="0.9" step="0.05" value="0.35"></label>
  <span id="status">Tap Start</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.webgpu.min.js"></script>
<script>
const MODEL_URL = 'yolov8n.onnx';   // exported with imgsz=320
const SIZE = 320;
const DRIVING = new Set([0, 1, 2, 3, 5, 7, 9, 11]); // person, bicycle, car, motorcycle, bus, truck, traffic light, stop sign
const NAMES = ['person','bicycle','car','motorcycle','airplane','bus','train','truck','boat','traffic light',
'fire hydrant','stop sign','parking meter','bench','bird','cat','dog','horse','sheep','cow','elephant','bear',
'zebra','giraffe','backpack','umbrella','handbag','tie','suitcase','frisbee','skis','snowboard','sports ball',
'kite','baseball bat','baseball glove','skateboard','surfboard','tennis racket','bottle','wine glass','cup',
'fork','knife','spoon','bowl','banana','apple','sandwich','orange','broccoli','carrot','hot dog','pizza',
'donut','cake','chair','couch','potted plant','bed','dining table','toilet','tv','laptop','mouse','remote',
'keyboard','cell phone','microwave','oven','toaster','sink','refrigerator','book','clock','vase','scissors',
'teddy bear','hair drier','toothbrush'];

const $ = id => document.getElementById(id);
const view = $('view'), vctx = view.getContext('2d');
const work = document.createElement('canvas');
work.width = work.height = SIZE;
const wctx = work.getContext('2d', { willReadFrequently: true });
const video = document.createElement('video');
video.playsInline = true; video.muted = true;

let session = null, running = false, fps = 0;

function setStatus(t) { $('status').textContent = t; }
function color(c) { return `hsl(${(c * 47) % 360} 90% 55%)`; }

async function start() {
  $('start').disabled = true;
  try {
    setStatus('Loading model...');
    ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/';
    ort.env.wasm.numThreads = 1;
    session = await ort.InferenceSession.create(MODEL_URL, { executionProviders: ['webgpu', 'wasm'] });

    setStatus('Starting camera...');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    view.width = video.videoWidth;
    view.height = video.videoHeight;

    try { await navigator.wakeLock?.request('screen'); } catch (e) {}

    running = true;
    $('start').style.display = 'none';
    loop();
  } catch (err) {
    console.error(err);
    setStatus('Error: ' + (err.message || err));
    $('start').disabled = false;
  }
}

function preprocess() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.min(SIZE / vw, SIZE / vh);
  const nw = Math.round(vw * scale), nh = Math.round(vh * scale);
  const padX = (SIZE - nw) / 2, padY = (SIZE - nh) / 2;
  wctx.fillStyle = '#727272';
  wctx.fillRect(0, 0, SIZE, SIZE);
  wctx.drawImage(video, padX, padY, nw, nh);
  const { data } = wctx.getImageData(0, 0, SIZE, SIZE);
  const n = SIZE * SIZE;
  const f = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) {
    f[i] = data[i * 4] / 255;
    f[n + i] = data[i * 4 + 1] / 255;
    f[2 * n + i] = data[i * 4 + 2] / 255;
  }
  return { tensor: new ort.Tensor('float32', f, [1, 3, SIZE, SIZE]), scale, padX, padY };
}

function iou(a, b) {
  const x1 = Math.max(a.x1, b.x1), y1 = Math.max(a.y1, b.y1);
  const x2 = Math.min(a.x2, b.x2), y2 = Math.min(a.y2, b.y2);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  const ua = (a.x2 - a.x1) * (a.y2 - a.y1) + (b.x2 - b.x1) * (b.y2 - b.y1) - inter;
  return ua > 0 ? inter / ua : 0;
}

function nms(boxes, thr) {
  boxes.sort((a, b) => b.score - a.score);
  const keep = [];
  for (const b of boxes) {
    if (keep.every(k => k.cls !== b.cls || iou(k, b) < thr)) keep.push(b);
  }
  return keep;
}

// YOLOv8 output: [1, 84, N] -> 4 box values (cx, cy, w, h) then 80 class scores
function postprocess(out, scale, padX, padY, conf, drivingOnly) {
  const C = out.dims[1], N = out.dims[2], d = out.data;
  const boxes = [];
  for (let i = 0; i < N; i++) {
    let best = -1, bs = 0;
    for (let c = 4; c < C; c++) {
      const s = d[c * N + i];
      if (s > bs) { bs = s; best = c - 4; }
    }
    if (bs < conf) continue;
    if (drivingOnly && !DRIVING.has(best)) continue;
    const cx = d[i], cy = d[N + i], w = d[2 * N + i], h = d[3 * N + i];
    boxes.push({
      x1: (cx - w / 2 - padX) / scale, y1: (cy - h / 2 - padY) / scale,
      x2: (cx + w / 2 - padX) / scale, y2: (cy + h / 2 - padY) / scale,
      score: bs, cls: best
    });
  }
  return nms(boxes, 0.45);
}

function draw(dets) {
  const fs = Math.max(14, Math.round(view.width / 45));
  vctx.lineWidth = Math.max(2, Math.round(view.width / 300));
  vctx.font = `bold ${fs}px system-ui, sans-serif`;
  vctx.textBaseline = 'top';
  for (const d of dets) {
    const col = color(d.cls);
    vctx.strokeStyle = col;
    vctx.strokeRect(d.x1, d.y1, d.x2 - d.x1, d.y2 - d.y1);
    const label = `${NAMES[d.cls]} ${Math.round(d.score * 100)}%`;
    const tw = vctx.measureText(label).width + 8;
    vctx.fillStyle = col;
    vctx.fillRect(d.x1, Math.max(0, d.y1 - fs - 4), tw, fs + 4);
    vctx.fillStyle = '#000';
    vctx.fillText(label, d.x1 + 4, Math.max(0, d.y1 - fs - 4) + 2);
  }
}

async function loop() {
  if (!running) return;
  const t0 = performance.now();
  vctx.drawImage(video, 0, 0, view.width, view.height);

  const { tensor, scale, padX, padY } = preprocess();
  const results = await session.run({ [session.inputNames[0]]: tensor });
  const out = results[session.outputNames[0]];
  const dets = postprocess(out, scale, padX, padY, parseFloat($('conf').value), $('driving').checked);
  draw(dets);

  const dt = performance.now() - t0;
  fps = fps ? fps * 0.9 + (1000 / dt) * 0.1 : 1000 / dt;
  setStatus(`${fps.toFixed(1)} FPS · ${dets.length} obj`);
  requestAnimationFrame(loop);
}

$('start').addEventListener('click', start);
</script>
</body>
</html>
